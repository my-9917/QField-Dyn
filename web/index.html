<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QField-Dyn — 蛋白质–配体轨迹预测</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#c9d1d9;
    --dim:#8b949e; --ok:#3fb950; --bad:#f85149; --hi:#58a6ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  code, .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:19px; margin:0; color:#f0f6fc; }
  header span { color:var(--dim); font-size:12.5px; }
  main { display:grid; grid-template-columns:360px 1fr; gap:18px; padding:22px 28px; max-width:1280px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .panel h2 { font-size:13px; margin:0 0 12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .run-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  label { display:block; margin:12px 0 4px; color:var(--dim); font-size:12.5px; }
  input, select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; }
  .upload { display:flex; min-height:116px; border:1px dashed var(--hi); border-radius:6px; align-items:center; justify-content:center; text-align:center; color:var(--hi); cursor:pointer; padding:16px; }
  .upload:hover, .upload.drag { background:#111b2d; border-color:#79c0ff; }
  .upload input { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  .chip { width:auto; margin:0; padding:3px 9px; background:#21262d; color:var(--hi); border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:600; }
  .chip:hover { border-color:var(--hi); }
  button { width:100%; margin-top:16px; background:#238636; color:#fff; border:1px solid #2ea043; border-radius:6px; padding:10px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .secondary { width:auto; margin:0; padding:4px 10px; background:#21262d; border-color:var(--line); color:var(--hi); font-size:12px; }
  .meta { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:5px 12px; font-size:12.5px; }
  .meta span:nth-child(odd) { color:var(--dim); }
  .footnote { color:var(--dim); font-size:11.5px; margin-top:6px; }
  .status-line { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .run { color:var(--hi); }
  .progress { height:7px; background:var(--bg); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:10px 0 16px; }
  .progress > span { display:block; width:0; height:100%; background:var(--hi); transition:width .25s ease; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  pre { margin:0; min-height:214px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px; white-space:pre-wrap; color:var(--fg); font:12px/1.55 ui-monospace,Menlo,Consolas,monospace; }
  .download { display:none; width:100%; margin-top:12px; text-align:center; text-decoration:none; background:#238636; color:#fff; border:1px solid #2ea043; border-radius:6px; padding:9px; font-weight:600; }
  .boundary { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
  .boundary strong { display:block; color:#f0f6fc; margin-bottom:5px; }
  .boundary div { border-left:2px solid var(--line); padding-left:12px; color:var(--dim); }
  .boundary div:first-child { border-color:var(--hi); }
  @media (max-width:900px) {
    main { grid-template-columns:1fr; padding:16px; }
    .run-grid, .boundary { grid-template-columns:1fr; }
    .boundary { grid-column:auto; }
    header { padding:16px; display:block; }
    header span { display:block; margin-top:3px; }
  }
</style>
</head>
<body>
<header><h1>QField-Dyn</h1><span>符合赛事协议的蛋白质–配体未来轨迹预测</span></header>
<main>
  <section class="panel">
    <h2>预测请求</h2>
    <label for="dataset">数据集 ZIP</label>
    <label class="upload" id="dropZone" for="dataset">
      <span id="uploadText">选择或拖入一个协议兼容 ZIP<br><small>仅含观测帧 · PDB + XTC + meta.json</small></span>
      <input id="dataset" type="file" accept=".zip,application/zip">
    </label>

    <label for="tier">预测规格</label>
    <select id="tier">
      <option value="T1">T1 · 观测 10 帧 → 预测 10 帧</option>
      <option value="T2">T2 · 观测 80 帧 → 预测 20 帧</option>
      <option value="T3">T3 · 观测 20 帧 → 预测 80 帧</option>
      <option value="T4">T4 · 观测 10 帧 → 预测 490 帧</option>
    </select>
    <div class="chips" aria-label="快速选择预测规格">
      <button class="chip" type="button" data-tier="T1">T1 局部</button>
      <button class="chip" type="button" data-tier="T2">T2 历史</button>
      <button class="chip" type="button" data-tier="T3">T3 长预测</button>
      <button class="chip" type="button" data-tier="T4">T4 长程</button>
    </div>
    <div class="meta" id="specMeta"></div>
    <button id="runButton" type="button" disabled>开始预测</button>
    <div class="footnote">服务只读取上传的拓扑和观测轨迹，不检索未来帧或识别匿名体系。</div>
  </section>

  <section class="panel">
    <h2>运行状态</h2>
    <div class="status-line"><span>状态：<strong id="status" class="run">就绪</strong></span><span class="mono" id="jobId">—</span></div>
    <div class="progress" aria-label="预测进度"><span id="progressBar"></span></div>
    <div class="run-grid">
      <div>
        <table>
          <tbody>
            <tr><th>文件</th><td id="fileCell">—</td></tr>
            <tr><th>档次</th><td id="tierCell">T1</td></tr>
            <tr><th>体系数</th><td id="systemsCell">—</td></tr>
            <tr><th>设备</th><td id="deviceCell">NVIDIA GPU</td></tr>
            <tr><th>输出</th><td id="outputCell">仅未来帧</td></tr>
          </tbody>
        </table>
        <a class="download" id="download" href="#">⬇ 下载预测结果 ZIP</a>
      </div>
      <div>
        <pre id="log">请上传协议兼容 ZIP，并选择预测规格。</pre>
      </div>
    </div>
  </section>

  <section class="panel boundary">
    <div><strong>支持的输入</strong>符合 QField-Dyn 目录结构与原子顺序的固定蛋白、配体运动轨迹。</div>
    <div><strong>生成的输出</strong>单位为 nm 的完整体系 XTC；蛋白与环境坐标固定，只预测配体坐标。</div>
    <div><strong>当前适用边界</strong>蛋白质–配体数据需使用相同拓扑约定，并符合四种公开时间规格之一。</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const specs = {
  T1:{obs:10,pred:10,dt:'80 ps',focus:'局部动力学'},
  T2:{obs:80,pred:20,dt:'80 ps',focus:'历史条件预测'},
  T3:{obs:20,pred:80,dt:'80 ps',focus:'长时滚动预测'},
  T4:{obs:10,pred:490,dt:'1,000 ps',focus:'长程稳定性'}
};
let selectedFile = null;
let requestSeq = 0;

function renderSpec() {
  const tier = $('tier').value;
  const s = specs[tier];
  $('specMeta').innerHTML = [
    ['观测帧数', s.obs], ['预测帧数', s.pred],
    ['帧间隔', s.dt], ['主要目标', s.focus]
  ].map(([k,v]) => `<span>${esc(k)}</span><strong>${esc(v)}</strong>`).join('');
  $('tierCell').innerHTML = esc(tier);
}

function chooseFile(file) {
  selectedFile = file || null;
  $('runButton').disabled = !selectedFile;
  $('fileCell').innerHTML = selectedFile ? esc(selectedFile.name) : '—';
  $('uploadText').innerHTML = selectedFile
    ? `${esc(selectedFile.name)}<br><small>${esc((selectedFile.size / 1048576).toFixed(2))} MiB</small>`
    : '选择或拖入一个协议兼容 ZIP<br><small>仅含观测帧 · PDB + XTC + meta.json</small>';
}

function setState(label, css, progress, message) {
  $('status').className = css;
  $('status').innerHTML = esc(label);
  $('progressBar').style.width = `${Math.max(0, Math.min(100, Number(progress) || 0))}%`;
  $('log').innerHTML = esc(message);
}

async function pollJob(jobId, seq) {
  let transientFailures = 0;
  while (seq === requestSeq) {
    try {
      const response = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`, {cache:'no-store'});
      if (!response.ok) throw new Error(`状态请求失败（${response.status}）`);
      const job = await response.json();
      transientFailures = 0;
      $('systemsCell').innerHTML = esc(job.systems ?? '—');
      setState(job.label, job.state === 'failed' ? 'bad' : job.state === 'completed' ? 'ok' : 'run', job.progress, job.message);
      if (job.state === 'completed') {
        $('download').href = job.download_url;
        $('download').style.display = 'block';
        $('runButton').disabled = false;
        return;
      }
      if (job.state === 'failed') {
        $('runButton').disabled = false;
        return;
      }
    } catch (error) {
      transientFailures += 1;
      if (transientFailures >= 3) {
        setState('连接失败', 'bad', 0, error.message);
        $('runButton').disabled = false;
        return;
      }
    }
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
}

async function submitJob() {
  if (!selectedFile) return;
  const seq = ++requestSeq;
  $('runButton').disabled = true;
  $('download').style.display = 'none';
  $('jobId').innerHTML = '—';
  $('systemsCell').innerHTML = '—';
  setState('上传中', 'run', 3, '正在上传观测轨迹包…');
  const body = new FormData();
  body.append('tier', $('tier').value);
  body.append('dataset', selectedFile, selectedFile.name);
  try {
    const response = await fetch('/api/jobs', {method:'POST', body});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
    if (seq !== requestSeq) return;
    $('jobId').innerHTML = esc(data.job_id);
    await pollJob(data.job_id, seq);
  } catch (error) {
    if (seq !== requestSeq) return;
    setState('请求失败', 'bad', 0, error.message);
    $('runButton').disabled = false;
  }
}

$('tier').addEventListener('change', renderSpec);
$('dataset').addEventListener('change', event => chooseFile(event.target.files[0]));
$('runButton').addEventListener('click', submitJob);
document.querySelectorAll('[data-tier]').forEach(button => button.addEventListener('click', () => {
  $('tier').value = button.dataset.tier;
  renderSpec();
}));
const dropZone = $('dropZone');
['dragenter','dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.add('drag'); }));
['dragleave','drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.remove('drag'); }));
dropZone.addEventListener('drop', event => chooseFile(event.dataTransfer.files[0]));
renderSpec();
</script>
</body>
</html>
