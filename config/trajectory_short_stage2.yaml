task: T1
seed: 20260826

data:
  md: data/MD.hdf5
  manifest: reproduced_data/manifest.csv
  internal_split: reproduced_data/expert_split.csv
  train_graph_cache: reproduced_data/graph_train.hdf5
  train_ligand_coordinates: reproduced_data/coordinates_train.hdf5
  train_quantum_features: reproduced_data/quantum_features_train.hdf5

initialization:
  checkpoint: reproduced_artifacts/trajectory_short_stage1.pt

graph:
  cross_cutoff_angstrom: 6.0

model:
  hidden_dim: 128
  layer_count: 3
  quantum_feature_dim: 132

loss:
  contact_temperature: 0.25
  weights:
    coordinate: 2.0
    bond: 10.0
    angle: 50.0
    rmsf: 0.0637
    speed_w1: 0.0979
    contact_w1: 0.1220
    contact_transition: 1.0185
    velocity_correlation: 0.7300
    radius_of_gyration: 0.2567

training:
  rollout_steps: 10
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  validation_batch_size: 8
  learning_rate: 0.00002
  weight_decay: 0.000001
  gradient_clip_norm: 1.0
  max_epochs: 3
  early_stopping_patience: 2
  max_wall_hours: 4
  num_workers: 0

validation:
  current_frame_index: 9

outputs:
  checkpoint: reproduced_artifacts/trajectory_model_t1.pt
  log: reproduced_results/trajectory_short_stage2.csv