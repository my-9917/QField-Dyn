seed: 20260815

data:
  q_cache: reproduced_data/expert_inputs.hdf5
  context_cache: reproduced_data/expert_inputs.hdf5
  ligand_coordinates: reproduced_data/coordinates_train.hdf5
  graph_cache: reproduced_data/graph_train.hdf5
  internal_split: reproduced_data/expert_split.csv

model:
  context_dim: 1033
